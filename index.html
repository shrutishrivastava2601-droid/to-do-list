<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Premium To-Do List Application</title>
  <meta name="description" content="A premium, responsive glassmorphism To-Do List application built with HTML5, CSS3, and Vanilla JavaScript.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Glassmorphism Glow Background -->
  <div class="app-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo" aria-label="TaskFlow Logo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="app-title">TaskFlow</h1>
          <p class="current-date" id="currentDateDisplay">Loading date...</p>
        </div>
      </div>

      <button id="themeToggleBtn" class="theme-toggle-btn ripple" aria-label="Toggle Light and Dark Theme" title="Toggle Theme">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
    </header>

    <!-- Statistics Cards -->
    <section class="stats-section">
      <div class="stat-card glass-card">
        <div class="stat-icon total-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
        </div>
        <div class="stat-content">
          <span class="stat-label">Total Tasks</span>
          <h2 class="stat-value" id="statTotal">0</h2>
        </div>
      </div>

      <div class="stat-card glass-card">
        <div class="stat-icon pending-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="stat-content">
          <span class="stat-label">Pending</span>
          <h2 class="stat-value" id="statPending">0</h2>
        </div>
      </div>

      <div class="stat-card glass-card">
        <div class="stat-icon completed-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
        <div class="stat-content">
          <span class="stat-label">Completed</span>
          <h2 class="stat-value" id="statCompleted">0</h2>
        </div>
      </div>
    </section>

    <!-- Task Input Section -->
    <section class="input-section glass-card">
      <form id="taskForm" class="task-form" novalidate>
        <div class="input-primary-row">
          <div class="input-field-wrapper">
            <svg class="field-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <input type="text" id="taskInput" placeholder="What needs to be done today?" autocomplete="off" maxlength="120" aria-label="Task Title Input">
          </div>
          <button type="submit" id="addTaskBtn" class="btn btn-primary ripple">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Add Task</span>
          </button>
        </div>

        <div class="input-secondary-row">
          <div class="form-control">
            <label for="prioritySelect">Priority</label>
            <div class="select-wrapper">
              <select id="prioritySelect" aria-label="Select Task Priority">
                <option value="medium">🟡 Medium</option>
                <option value="high">🔴 High</option>
                <option value="low">🟢 Low</option>
              </select>
            </div>
          </div>

          <div class="form-control">
            <label for="dueDateInput">Due Date</label>
            <input type="date" id="dueDateInput" aria-label="Select Due Date">
          </div>
        </div>

        <div id="inputErrorMessage" class="input-error-message" aria-live="polite"></div>
      </form>
    </section>

    <!-- Controls Section (Search & Filters) -->
    <section class="controls-section">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search tasks..." aria-label="Search Tasks">
        <button id="clearSearchBtn" class="clear-search-btn hidden" aria-label="Clear Search">✕</button>
      </div>

      <div class="filter-tabs" role="tablist" aria-label="Task Filter Tabs">
        <button class="filter-btn active ripple" data-filter="all" id="filterAll" role="tab" aria-selected="true">All</button>
        <button class="filter-btn ripple" data-filter="pending" id="filterPending" role="tab" aria-selected="false">Pending</button>
        <button class="filter-btn ripple" data-filter="completed" id="filterCompleted" role="tab" aria-selected="false">Completed</button>
      </div>
    </section>

    <!-- Task List Container -->
    <main class="task-list-container">
      <ul id="taskList" class="task-list" aria-label="Tasks List"></ul>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state glass-card hidden">
        <div class="empty-illustration">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="7" y1="8" x2="17" y2="8"/>
            <line x1="7" y1="12" x2="13" y2="12"/>
            <line x1="7" y1="16" x2="10" y2="16"/>
          </svg>
        </div>
        <h3 id="emptyStateTitle" class="empty-title">No tasks found</h3>
        <p id="emptyStateMessage" class="empty-message">Add a new task above to get started organizing your day.</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <button id="clearCompletedBtn" class="btn btn-ghost ripple" aria-label="Clear all completed tasks">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        <span>Clear Completed</span>
      </button>
    </footer>
  </div>

  <!-- Edit Task Modal Popup -->
  <div id="editModalOverlay" class="modal-overlay hidden" aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
    <div class="modal-card glass-card">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Edit Task</h2>
        <button id="closeModalBtn" class="close-modal-btn" aria-label="Close Modal">✕</button>
      </div>

      <form id="editTaskForm" novalidate>
        <div class="form-group">
          <label for="modalTaskTitle">Task Description</label>
          <input type="text" id="modalTaskTitle" maxlength="120" required>
        </div>

        <div class="modal-form-row">
          <div class="form-group">
            <label for="modalPriority">Priority</label>
            <select id="modalPriority">
              <option value="high">🔴 High</option>
              <option value="medium">🟡 Medium</option>
              <option value="low">🟢 Low</option>
            </select>
          </div>

          <div class="form-group">
            <label for="modalDueDate">Due Date</label>
            <input type="date" id="modalDueDate">
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="cancelEditModalBtn" class="btn btn-secondary ripple">Cancel</button>
          <button type="submit" class="btn btn-primary ripple">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
